services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cortex
      POSTGRES_PASSWORD: cortex
      POSTGRES_DB: cortex
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  server:
    build: ./server
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://cortex:cortex@postgres:5432/cortex
      PORT: "3000"
    depends_on:
      - postgres

  client:
    build: ./client
    ports:
      - "8080:80"
    depends_on:
      - server

volumes:
  postgres_data:
